# main 에 올라간 파수꾼 코드를 Lambda 에 반영한다.
# 영구 액세스 키를 레포에 두지 않으려고 OIDC 로 역할을 빌린다 (ADR #18).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC 토큰 발급. 이것이 없으면 역할을 빌리지 못한다
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # src/ 내용물이 zip 루트에 와야 한다. 폴더째 넣으면 handler 를 못 찾는다
      - name: zip 묶기
        run: cd src && zip -r ../watchdog.zip . -x "__pycache__/*"

      - name: Lambda 코드 교체
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://watchdog.zip \
            --publish
