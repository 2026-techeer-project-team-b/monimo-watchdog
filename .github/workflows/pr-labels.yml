# PR 라벨 3종(area/* · type/* · size/*)을 한 작업에서 순서대로 붙인다.
# 나눠 두면 안 된다 — actions/labeler 는 마지막에 라벨 목록을 통째로 바꾸므로(setLabels),
# 그 사이에 다른 워크플로가 붙인 라벨을 지운다. 실제로 type/* 가 1초 만에 사라졌다 (#8)
# pull_request_target 이지만 PR 코드를 내려받거나 실행하지 않으므로 안전하다.
name: PR Labels

on:
  pull_request_target:
    # edited 는 제목이 바뀌었을 때 type 을 다시 잡으려고 받는다
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # 라벨 목록을 통째로 바꾸는 단계라 반드시 먼저 돈다. 뒤에 두면 아래 둘을 지운다
      - name: 바뀐 파일 위치로 area 라벨 붙이기
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

      - name: PR 제목 앞머리로 type 라벨 붙이기
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const title = context.payload.pull_request.title;

            const prefixMap = {
              feat: 'type/feature',
              fix: 'type/bug',
              refactor: 'type/refactor',
              docs: 'type/docs',
              test: 'type/test',
              chore: 'type/chore',
              ci: 'type/ci',
              style: 'type/style',
              perf: 'type/perf',
            };
            const typeLabels = Object.values(prefixMap);

            const match = title.match(/^(\w+)(\(.+\))?!?:/);
            const prefix = match ? match[1].toLowerCase() : null;
            const target = prefix ? prefixMap[prefix] : null;
            if (!target) {
              core.info(`제목에서 타입을 찾지 못함: "${title}"`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const current = pr.labels.map(l => l.name).filter(l => typeLabels.includes(l));

            for (const label of current) {
              if (label !== target) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name: label });
              }
            }
            if (!current.includes(target)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: [target] });
            }
            core.info(`PR #${pull_number}: "${prefix}" -> ${target}`);

      - name: 변경 줄 수로 size 라벨 붙이기
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });

            const total = pr.additions + pr.deletions;
            const sizeLabel =
              total < 10 ? 'size/XS' :
              total < 50 ? 'size/S' :
              total < 200 ? 'size/M' :
              total < 500 ? 'size/L' : 'size/XL';

            const sizeLabels = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL'];
            const current = pr.labels.map(l => l.name).filter(l => sizeLabels.includes(l));

            for (const label of current) {
              if (label !== sizeLabel) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name: label });
              }
            }
            if (!current.includes(sizeLabel)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: [sizeLabel] });
            }
            core.info(`PR #${pull_number}: ${total}줄 변경 -> ${sizeLabel}`);
